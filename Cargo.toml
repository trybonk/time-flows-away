[package]
name = "time-flows-away-native"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native wallpaper inspired by twenty-zhang/time-flows-away"
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "glow", "x11"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ttf-parser = "0.25"
[target.'cfg(not(windows))'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "std", "wgsl"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "std", "wgsl"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_Security"] }
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
